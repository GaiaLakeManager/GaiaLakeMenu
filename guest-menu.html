<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gaia Lake Bungalow — Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --brand-1:#4C9D38; --brand-2:#1E9BD7;
  --cream:#fbf8f1; --paper:#ffffff; --ink:#1c2b22; --ink-soft:#5b6b60;
  --line:#e7e0d2; --accent:#e08a3c; --danger:#c0392b;
  box-sizing:border-box;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*{box-sizing:border-box;}
body{margin:0;background:var(--cream);color:var(--ink);font-family:'Manrope',sans-serif;-webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
h1,h2,.disp{font-family:'Fraunces',serif;}
.wrap{max-width:980px;margin:0 auto;padding:0 18px 60px;}
img{max-width:100%;}

/* ---------- header ---------- */
header{position:relative;overflow:hidden;background:linear-gradient(180deg,#eef7ee 0%, var(--cream) 85%);}
.banner{width:100%;height:180px;object-fit:cover;display:block;}
.head-body{position:relative;padding:22px 20px 30px;text-align:center;}
.head-body.no-banner{padding-top:calc(48px + env(safe-area-inset-top,0px));}
.logo{width:74px;height:74px;object-fit:contain;margin:-52px auto 10px;display:block;background:var(--paper);
  border-radius:18px;padding:8px;box-shadow:0 6px 18px rgba(0,0,0,.12);}
.head-body.no-banner .logo{margin-top:0;box-shadow:none;background:none;padding:0;}
h1{font-size:1.9rem;font-weight:600;margin:0 0 4px;color:var(--brand-1);}
.loc{color:var(--ink-soft);font-size:.95rem;margin:0 0 12px;}
.status-row{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;font-weight:700;padding:6px 13px;border-radius:999px;}
.badge.open{background:#e3f3e2;color:#2e7031;}
.badge.closed{background:#fbe7e4;color:var(--danger);}
.badge .dot{width:7px;height:7px;border-radius:50%;background:currentColor;}
.call-btn{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;font-weight:700;padding:6px 14px;border-radius:999px;
  background:var(--brand-1);color:#fff;text-decoration:none;}

.mode-toggle{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:14px;z-index:5;
  width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--paper);
  display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1.05rem;box-shadow:0 2px 8px rgba(0,0,0,.08);}

/* ---------- tabs ---------- */
nav{position:sticky;top:0;z-index:10;background:var(--cream);border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top,0px);}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:14px 20px;max-width:980px;margin:0 auto;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{flex:0 0 auto;padding:9px 18px;border-radius:999px;border:1px solid var(--line);background:var(--paper);
  color:var(--ink-soft);font-weight:600;font-size:.92rem;cursor:pointer;white-space:nowrap;transition:.15s;}
.tab:hover{border-color:var(--brand-2);}
.tab.active{background:var(--brand-1);border-color:var(--brand-1);color:#fff;}

/* ---------- panels / cards ---------- */
.panel{display:none;padding-top:28px;}
.panel.active{display:block;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;}
.card .photo-wrap{position:relative;aspect-ratio:4/3;background:linear-gradient(160deg,#eef7ee,#e4f3fb);}
.card .photo-wrap img{width:100%;height:100%;object-fit:cover;display:block;}
.card .photo-wrap .no-photo{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:2rem;opacity:.5;}
.tag-row{position:absolute;top:8px;left:8px;display:flex;gap:5px;flex-wrap:wrap;max-width:calc(100% - 16px);}
.tag{font-size:.68rem;font-weight:700;padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.92);color:var(--brand-1);
  box-shadow:0 1px 4px rgba(0,0,0,.12);}
.card .body{padding:13px 14px 15px;display:flex;flex-direction:column;gap:5px;flex:1;}
.card .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
.card .name{font-weight:700;font-size:1rem;}
.card .desc{color:var(--ink-soft);font-size:.85rem;line-height:1.5;flex:1;}
.price{font-family:'Fraunces',serif;font-weight:600;color:var(--accent);white-space:nowrap;}
.price .usd{display:block;font-family:'Manrope',sans-serif;font-weight:600;font-size:.72rem;color:var(--ink-soft);}

.empty-state, .loading{text-align:center;padding:60px 20px;color:var(--ink-soft);}
.loading .spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--brand-1);
  margin:0 auto 14px;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

footer{text-align:center;padding:30px 20px 8px;color:var(--ink-soft);font-size:.85rem;line-height:1.7;}
.dev-footer{background:var(--brand-1);color:#fff;text-align:center;font-size:.8rem;
  padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));letter-spacing:.01em;}

/* ---------- dark mode ---------- */
:root[data-theme="dark"]{--cream:#141a15;--paper:#1b2219;--ink:#eef1ea;--ink-soft:#a7b3a3;--line:#2b342b;}
:root[data-theme="dark"] header{background:linear-gradient(180deg,#182018 0%, var(--cream) 85%);}
:root[data-theme="dark"] .card .photo-wrap{background:linear-gradient(160deg,#20291f,#17222a);}
:root[data-theme="dark"] .mode-toggle{background:var(--paper);border-color:var(--line);color:var(--ink);}
:root[data-theme="dark"] .tag{background:rgba(27,34,25,.9);}
</style>
</head>
<body>

<header id="header">
  <button class="mode-toggle" id="modeToggle" title="Toggle dark / light mode" aria-label="Toggle dark or light mode">🌙</button>
  <div id="headBody" class="head-body no-banner">
    <img class="logo" id="logoImg" style="display:none">
    <h1 id="restName">Loading…</h1>
    <p class="loc" id="restLoc"></p>
    <div class="status-row" id="statusRow"></div>
  </div>
</header>

<nav><div class="tabs" id="tabs"></div></nav>

<div class="wrap">
  <div id="loadingState" class="loading"><div class="spin"></div>Loading menu…</div>
  <div id="panels" style="display:none"></div>
</div>

<footer>Prices are shown for reference and may vary slightly at time of order.</footer>
<div class="dev-footer" id="devFooter">Developed by Prasanna Kurukuladithya (Priya) | Gaia Lake Kandalama - Sri Lanka | v1.0 | Copyright © 2026. All rights reserved.</div>

<script src="config.js"></script>
<script>
/* ---------------- theme mode ---------------- */
const root = document.documentElement;
const savedMode = localStorage.getItem('gl-menu-mode');
if (savedMode) root.setAttribute('data-theme', savedMode);
function applyModeIcon(){
  const isDark = root.getAttribute('data-theme') === 'dark'
    || (!root.getAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches);
  document.getElementById('modeToggle').textContent = isDark ? '☀️' : '🌙';
}
applyModeIcon();
document.getElementById('modeToggle').onclick = () => {
  const current = root.getAttribute('data-theme')
    || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = current === 'dark' ? 'light' : 'dark';
  root.setAttribute('data-theme', next);
  localStorage.setItem('gl-menu-mode', next);
  applyModeIcon();
};

/* ---------------- helpers ---------------- */
function driveImageUrl(fileId, size){ return fileId ? `https://drive.google.com/thumbnail?id=${fileId}&sz=w${size||800}` : ''; }
function money(v, cur){ return v===undefined||v===null||v==='' ? '' : `${cur} ${Number(v).toLocaleString(undefined,{minimumFractionDigits: cur==='LKR'?0:2, maximumFractionDigits: cur==='LKR'?0:2})}`; }
function esc(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function computeOpenStatus(settings){
  if (!settings) return null;
  if (settings.acceptingOrders === false) return { open:false, label:'Currently Closed' };
  const open = settings.kitchenOpen || '06:00', close = settings.kitchenClose || '23:00';
  const now = new Date().toLocaleString('en-GB', { timeZone:'Asia/Colombo', hour:'2-digit', minute:'2-digit', hour12:false });
  const toMin = t => { const [h,m] = t.split(':').map(Number); return h*60+m; };
  const n = toMin(now), o = toMin(open), c = toMin(close);
  const isOpen = o <= c ? (n >= o && n < c) : (n >= o || n < c); // handles overnight ranges
  return isOpen
    ? { open:true, label:'Open Now' }
    : { open:false, label:`Closed — opens ${open}` };
}

/* ---------------- render ---------------- */
function render(data){
  const profile = data.profile || {};
  const settings = data.settings || {};
  const theme = settings.theme || CONFIG.DEFAULT_THEME;
  root.style.setProperty('--brand-1', theme.primary || CONFIG.DEFAULT_THEME.primary);
  root.style.setProperty('--brand-2', theme.secondary || CONFIG.DEFAULT_THEME.secondary);

  document.title = (profile.name || CONFIG.RESTAURANT_NAME_FALLBACK) + ' — Menu';
  document.getElementById('restName').textContent = profile.name || CONFIG.RESTAURANT_NAME_FALLBACK;
  const loc = [profile.city, profile.country].filter(Boolean).join(', ');
  document.getElementById('restLoc').textContent = loc;

  const headBody = document.getElementById('headBody');
  if (profile.bannerFileId){
    const banner = document.createElement('img');
    banner.className = 'banner'; banner.src = driveImageUrl(profile.bannerFileId, 1200); banner.alt = '';
    document.getElementById('header').insertBefore(banner, headBody);
    headBody.classList.remove('no-banner');
  }
  if (profile.logoFileId){
    const logoImg = document.getElementById('logoImg');
    logoImg.src = driveImageUrl(profile.logoFileId, 300);
    logoImg.style.display = 'block';
  }

  const statusRow = document.getElementById('statusRow');
  statusRow.innerHTML = '';
  const status = computeOpenStatus(settings);
  if (status){
    const b = document.createElement('span');
    b.className = 'badge ' + (status.open ? 'open' : 'closed');
    b.innerHTML = `<span class="dot"></span>${esc(status.label)}`;
    statusRow.appendChild(b);
  }
  if (profile.phone){
    const a = document.createElement('a');
    a.className = 'call-btn'; a.href = 'tel:' + profile.phone.replace(/\s+/g,'');
    a.innerHTML = '📞 Call';
    statusRow.appendChild(a);
  }

  const devFooter = document.getElementById('devFooter');
  if (data.meta && data.meta.appVersion) {
    devFooter.textContent = devFooter.textContent.replace(/v[\d.]+/, 'v' + data.meta.appVersion);
  }

  const categories = (data.categories || []).slice().sort((a,b)=>(a.order||0)-(b.order||0));
  const dishes = (data.dishes || []).filter(d => d.active !== false);
  const tabsEl = document.getElementById('tabs');
  const panelsEl = document.getElementById('panels');
  tabsEl.innerHTML = ''; panelsEl.innerHTML = '';

  if (!categories.length){
    panelsEl.innerHTML = '<div class="empty-state">The menu isn\'t published yet — please check back soon.</div>';
  }

  categories.forEach((cat, i) => {
    const items = dishes.filter(d => d.categoryId === cat.id).sort((a,b)=>(a.order||0)-(b.order||0));
    const tab = document.createElement('button');
    tab.className = 'tab' + (i===0 ? ' active' : '');
    tab.textContent = `${cat.icon ? cat.icon+' ' : ''}${cat.name} (${items.length})`;
    tab.onclick = () => selectTab(cat.id);
    tab.dataset.cat = cat.id;
    tabsEl.appendChild(tab);

    const panel = document.createElement('div');
    panel.className = 'panel' + (i===0 ? ' active' : '');
    panel.id = 'panel-' + cat.id;
    if (!items.length){
      panel.innerHTML = '<div class="empty-state">No items in this category yet.</div>';
    } else {
      panel.innerHTML = `<div class="grid">${items.map(renderCard).join('')}</div>`;
    }
    panelsEl.appendChild(panel);
  });

  document.getElementById('loadingState').style.display = 'none';
  panelsEl.style.display = 'block';
}

function renderCard(d){
  const img = d.imageFileId
    ? `<img src="${driveImageUrl(d.imageFileId,700)}" alt="${esc(d.name)}" loading="lazy">`
    : `<div class="no-photo">🍽️</div>`;
  const tags = (d.tags||[]).map(t => `<span class="tag">${esc(t)}</span>`).join('');
  const usd = d.price && d.price.usd ? `<span class="usd">${money(d.price.usd,'USD')}</span>` : '';
  const lkr = d.price ? money(d.price.lkr,'LKR') : '';
  return `<div class="card">
    <div class="photo-wrap">${img}${tags?`<div class="tag-row">${tags}</div>`:''}</div>
    <div class="body">
      <div class="row"><span class="name">${esc(d.name)}</span><span class="price">${lkr}${usd}</span></div>
      ${d.description?`<div class="desc">${esc(d.description)}</div>`:''}
    </div>
  </div>`;
}

function selectTab(catId){
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.cat === catId));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + catId));
  window.scrollTo({top:0, behavior:'smooth'});
}

/* ---------------- fetch live data ---------------- */
async function loadMenu(){
  if (!CONFIG.MENU_FILE_ID || CONFIG.GOOGLE_API_KEY.startsWith('PASTE_')){
    document.getElementById('loadingState').innerHTML =
      '<div class="empty-state">Menu isn\'t connected yet — an administrator needs to finish setup (config.js).</div>';
    return;
  }
  try{
    const url = `https://www.googleapis.com/drive/v3/files/${CONFIG.MENU_FILE_ID}?alt=media&key=${CONFIG.GOOGLE_API_KEY}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    render(data);
  }catch(err){
    console.error('Failed to load menu:', err);
    document.getElementById('loadingState').innerHTML =
      '<div class="empty-state">Couldn\'t load the menu right now. Please try again in a moment, or ask a staff member for a printed menu.</div>';
  }
}
loadMenu();
</script>
</body>
</html>
